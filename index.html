<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>실버만삭스 펀드 데스크</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: #000; color: #f5f5f7; }
  .box { text-align: center; padding: 24px 16px; }
  .t { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .s { font-size: 14px; color: #8a8a8a; line-height: 1.6; }
  a { color: #ff8a1f; }
</style>
</head>
<body>
<div class="box">
  <div class="t">실버만삭스 펀드 데스크로 이동 중…</div>
  <div class="s" id="msg">잠시만 기다려 주세요.</div>
</div>
<script>
// 현재 터널 주소는 url.txt 에 있다(share_tunnel.py 가 터널을 다시 띄울 때마다 갱신).
// Pages CDN 캐시(최대 10분)를 피하려고 GitHub API 로 최신본을 먼저 읽고, 실패하면 아래 기본값으로 간다.
var FALLBACK = "https://tutorials-hybrid-displayed-administrator.trycloudflare.com";
var API = "https://api.github.com/repos/financialnen-wq/silverman-fund/contents/url.txt?ref=main&t=" + Date.now();
function go(u) {
  u = (u || "").trim();
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(u)) u = FALLBACK;
  location.replace(u);
}
fetch(API, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" })
  .then(function (r) { return r.ok ? r.text() : ""; })
  .then(go, function () { go(""); });
setTimeout(function () {
  document.getElementById("msg").innerHTML =
    '넘어가지 않으면 <a href="' + FALLBACK + '">여기</a>를 눌러 주세요.<br>계속 안 열리면 공유 PC가 꺼져 있는 상태입니다.';
}, 6000);
</script>
</body>
</html>
